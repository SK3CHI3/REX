<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="fgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)" rx="8"/>
  
  <!-- Logo circle -->
  <g transform="translate(200, 120)">
    <circle cx="0" cy="0" r="55" fill="url(#accentGrad)"/>
    
    <!-- Scales of Justice -->
    <g stroke="url(#fgGrad)" fill="url(#fgGrad)" stroke-linecap="round" stroke-linejoin="round">
      <line x1="0" y1="-22" x2="0" y2="25" stroke-width="4"/>
      <line x1="-12" y1="25" x2="12" y2="25" stroke-width="4"/>
      <line x1="-28" y1="-22" x2="28" y2="-22" stroke-width="4"/>
      <line x1="-28" y1="-22" x2="-34" y2="-7" stroke-width="2.5"/>
      <line x1="-28" y1="-22" x2="-22" y2="-7" stroke-width="2.5"/>
      <line x1="28" y1="-22" x2="34" y2="-7" stroke-width="2.5"/>
      <line x1="28" y1="-22" x2="22" y2="-7" stroke-width="2.5"/>
      <path d="M-37,-7 Q-28,1 -19,-7" stroke-width="3" fill="none"/>
      <path d="M19,-7 Q28,1 37,-7" stroke-width="3" fill="none"/>
      <circle cx="0" cy="-22" r="4" fill="url(#fgGrad)" stroke="none"/>
    </g>
  </g>
  
  <!-- PBT Text -->
  <text x="200" y="210" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="url(#fgGrad)">PBT</text>
  
  <!-- Subtitle -->
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#64748b">PoliceBrutalityTracker</text>
</svg>
