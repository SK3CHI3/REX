<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2d0a0a"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  
  <!-- Dark background -->
  <circle cx="100" cy="100" r="98" fill="url(#bg)"/>
  
  <!-- Eye - outer shape -->
  <path d="M30,100 Q100,40 170,100 Q100,160 30,100 Z" 
        fill="none" stroke="url(#red)" stroke-width="6"/>
  
  <!-- Iris -->
  <circle cx="100" cy="100" r="28" fill="url(#red)" opacity="0.9"/>
  
  <!-- Pupil -->
  <circle cx="100" cy="100" r="14" fill="#1a1a1a"/>
  
  <!-- Inner pupil reflection -->
  <circle cx="95" cy="95" r="4" fill="#ef4444" opacity="0.6"/>
  
  <!-- Subtle grid lines (tracking metaphor) -->
  <g stroke="#dc2626" stroke-width="1" opacity="0.3">
    <line x1="100" y1="60" x2="100" y2="140"/>
    <line x1="60" y1="100" x2="140" y2="100"/>
    <circle cx="100" cy="100" r="45" fill="none"/>
  </g>
</svg>
