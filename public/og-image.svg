<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="0" x2="1200" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="1200" y1="0" x2="0" y2="630" stroke="#ffffff" stroke-width="1"/>
    <circle cx="600" cy="315" r="250" fill="none" stroke="#ffffff" stroke-width="1"/>
    <circle cx="600" cy="315" r="350" fill="none" stroke="#ffffff" stroke-width="0.5"/>
  </g>
  
  <!-- Logo circle -->
  <g transform="translate(600, 220)">
    <circle cx="0" cy="0" r="100" fill="#1a1a1a"/>
    
    <!-- Eye -->
    <path d="M-60,0 Q0,-50 60,0 Q0,50 -60,0 Z" fill="none" stroke="url(#accentGrad)" stroke-width="6"/>
    <circle cx="0" cy="0" r="28" fill="url(#accentGrad)" opacity="0.9"/>
    <circle cx="0" cy="0" r="14" fill="#1a1a1a"/>
    <circle cx="-5" cy="-5" r="4" fill="#ef4444" opacity="0.6"/>
    
    <!-- Grid lines -->
    <g stroke="#dc2626" stroke-width="1" opacity="0.3">
      <line x1="0" y1="-45" x2="0" y2="45"/>
      <line x1="-45" y1="0" x2="45" y2="0"/>
      <circle cx="0" cy="0" r="45" fill="none"/>
    </g>
  </g>
  
  <!-- Title -->
  <text x="600" y="390" font-family="Arial, sans-serif" font-size="52" font-weight="bold" text-anchor="middle" fill="url(#textGrad)">PoliceBrutalityTracker</text>
  
  <!-- Tagline -->
  <text x="600" y="430" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#94a3b8">Justice through visibility</text>
  
  <!-- Domain -->
  <text x="600" y="480" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#64748b">policebrutalitytracker.co.ke</text>
  
  <!-- Accent line -->
  <rect x="500" y="500" width="200" height="3" rx="1.5" fill="url(#accentGrad)"/>
</svg>
