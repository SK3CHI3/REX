<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="0" x2="1200" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="1200" y1="0" x2="0" y2="630" stroke="#ffffff" stroke-width="1"/>
    <circle cx="600" cy="315" r="250" fill="none" stroke="#ffffff" stroke-width="1"/>
    <circle cx="600" cy="315" r="350" fill="none" stroke="#ffffff" stroke-width="0.5"/>
  </g>
  
  <!-- Logo circle -->
  <g transform="translate(600, 220)">
    <circle cx="0" cy="0" r="100" fill="url(#accentGrad)"/>
    
    <!-- Scales of Justice -->
    <g stroke="#ffffff" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round">
      <line x1="0" y1="-40" x2="0" y2="45" stroke-width="6"/>
      <line x1="-22" y1="45" x2="22" y2="45" stroke-width="6"/>
      <line x1="-50" y1="-40" x2="50" y2="-40" stroke-width="6"/>
      <line x1="-50" y1="-40" x2="-60" y2="-12" stroke-width="4"/>
      <line x1="-50" y1="-40" x2="-40" y2="-12" stroke-width="4"/>
      <line x1="50" y1="-40" x2="60" y2="-12" stroke-width="4"/>
      <line x1="50" y1="-40" x2="40" y2="-12" stroke-width="4"/>
      <path d="M-65,-12 Q-50,2 -35,-12" stroke-width="5" fill="none"/>
      <path d="M35,-12 Q50,2 65,-12" stroke-width="5" fill="none"/>
      <circle cx="0" cy="-40" r="6" fill="#ffffff" stroke="none"/>
    </g>
  </g>
  
  <!-- Title -->
  <text x="600" y="390" font-family="Arial, sans-serif" font-size="52" font-weight="bold" text-anchor="middle" fill="url(#textGrad)">PoliceBrutalityTracker</text>
  
  <!-- Tagline -->
  <text x="600" y="430" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#94a3b8">Justice through visibility</text>
  
  <!-- Domain -->
  <text x="600" y="480" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#64748b">policebrutalitytracker.co.ke</text>
  
  <!-- Accent line -->
  <rect x="500" y="500" width="200" height="3" rx="1.5" fill="url(#accentGrad)"/>
</svg>
